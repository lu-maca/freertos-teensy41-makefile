flags:
    - -Wall
    - -O2
    - -g
cflags:
    - -std=gnu11
    - -ffunction-sections
    - -fdata-sections
cxxflags:
    - -std=gnu++20
    - -fno-exceptions
    - -fno-rtti
    - -fno-threadsafe-statics
    - -felide-constructors
    - -fpermissive
    - -Wno-error=narrowing

library_options:
    libcsp:
        enable_reproducible_builds : true
        with_max_connections       : 20
        with_conn_queue_length     : 100
        with_router_queue_length   : 100
        with_max_bind_port         : 40
        with_os                    : "linux"
        with_rtable                : "cidr"
        with_padding               : 2
        with_driver_usart          : linux
        enable_crc32               : true
        enable_xtea                : false
        enable_hmac                : false
        enable_dedup               : true
        enable_if_i2c              : false
        enable_if_kiss             : true
        enable_if_can              : false
        enable_rdp                 : false
        disable_stlib              : true
        disable_output             : true
        disable_print_stdio        : true
